[project]
name = "caesar-cipher-cryptography"
version = "1.0.0"
description = "Encrypt or decrypt a message using the Caesar Cipher technique over the printable ASCII character set."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tan Duc Mai", email = "henryfromvietnam@gmail.com" }]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "--cov=main --cov-report=term-missing"
testpaths = ["tests"]
